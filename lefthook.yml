pre-commit:
  commands:
    prettier:
      glob: '*.{ts,tsx,js,jsx,json,css,md}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    typecheck:
      run: pnpm --filter web exec tsc --noEmit
    lint:
      run: pnpm --filter web lint
    typecheck-mobile:
      run: pnpm --filter mobile typecheck
    typecheck-shared:
      run: pnpm --filter @pomoroutine/shared typecheck

pre-push:
  commands:
    no-direct-main-push:
      run: |
        branch=$(git symbolic-ref HEAD 2>/dev/null | sed 's|refs/heads/||')
        if [ "$branch" = "main" ]; then
          echo "❌ main 브랜치 직접 push 금지. 기능 브랜치 → PR을 사용하세요."
          exit 1
        fi
    # e2e: PR 생성 시 GitHub Actions에서 실행
    #   run: pnpm --filter web test:e2e
