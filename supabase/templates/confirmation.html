<!doctype html>
<html lang="ko">
  <body style="margin: 0; padding: 0; background: #f8f9fa">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="
        background: #f8f9fa;
        padding: 40px 16px;
        word-break: keep-all;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      "
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              background: #ffffff;
              border: 1px solid #e5e7eb;
              border-radius: 16px;
              padding: 40px 32px;
            "
          >
            <tr>
              <td style="font-size: 18px; font-weight: 700; color: #0aaa7d; padding-bottom: 24px">
                PomoRoutine
              </td>
            </tr>
            <tr>
              <td style="font-size: 22px; font-weight: 700; color: #111111; padding-bottom: 12px">
                이메일 인증만 남았어요
              </td>
            </tr>
            <tr>
              <td style="font-size: 15px; line-height: 1.6; color: #374151; padding-bottom: 28px">
                버튼을 누르면 인증이 끝나고 바로 시작할 수 있어요
              </td>
            </tr>
            <tr>
              <td>
                <a
                  href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}"
                  style="
                    display: inline-block;
                    background: #0aaa7d;
                    color: #ffffff;
                    font-size: 15px;
                    font-weight: 600;
                    text-decoration: none;
                    padding: 14px 28px;
                    border-radius: 10px;
                  "
                  >이메일 인증하기</a
                >
              </td>
            </tr>
            <tr>
              <td style="height: 32px"></td>
            </tr>
            <tr>
              <td
                style="
                  font-size: 13px;
                  line-height: 1.6;
                  color: #6b7280;
                  padding-top: 24px;
                  border-top: 1px solid #e5e7eb;
                "
              >
                직접 가입하지 않았다면 이 메일은 무시해주세요<br />문의 privacy@pomoroutine.com
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
